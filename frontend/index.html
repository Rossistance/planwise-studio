<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the layout reach under the notch and home
     indicator; the CSS pays that back with env(safe-area-inset-*) padding.
     No maximum-scale: pinch-zoom on a drawing is a feature, not a bug. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PlanWise</title>

<!-- The favicon is what the DESKTOP APP WINDOW uses for its taskbar icon, not
     just what a browser tab shows: `msedge --app=` takes the window icon from
     the page, so without this the installed PlanWise appeared as a generic
     Edge window. The manifest icons below don't cover it — those are for
     installing, not for chrome. A multi-size .ico so Windows can pick 16px for
     the taskbar and 256px for alt-tab without scaling artefacts. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

<link rel="stylesheet" href="/styles.css">

<!-- Installable app (Phase 5e). theme-color paints the iOS status bar and the
     Android task-switcher header; the two values track the light and dark
     themes so a home-screen PlanWise doesn't show a stripe of the wrong one. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#C7420A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191C1F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS reads its own vendor-prefixed pair; without these, Add to Home Screen
     produces a Safari shortcut rather than a standalone app window. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlanWise">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
/* Theme before first paint — OS preference, sticky override in localStorage. */
(function () {
  var saved = localStorage.getItem("planwise.theme");
  var dark = saved ? saved === "dark"
                   : matchMedia("(prefers-color-scheme: dark)").matches;
  if (dark) document.documentElement.dataset.theme = "dark";
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">Plan<b>Wise</b></span>
    <span class="tagline">Project Controls</span>
  </div>
  <div class="job-picker">
    <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="jobSearch" type="search" placeholder="Job number or name…" autocomplete="off" spellcheck="false">
    <ul id="jobResults" class="results hidden"></ul>
  </div>
  <span style="flex:1"></span>
  <div id="freshness" class="chip" title="Vista extract">—</div>
  <button id="userChip" class="chip clickable" title="Signed-in user">—</button>
  <button id="settingsBtn" class="iconbtn" title="Settings — AI, spend cap, companion">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.4 2.5A7.6 7.6 0 0 0 7 6L4.6 5l-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.5z"/></svg>
  </button>
  <button id="themeBtn" class="iconbtn" title="Toggle light / dark">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div id="settingsDlg" class="overlay hidden">
  <div class="dialog" style="width:480px">
    <h2>Settings</h2>
    <div class="sub">Shared by the whole team — keys are stored on the server, never shown in full.</div>
    <div id="settingsBody">Loading…</div>
  </div>
</div>

<!-- Offline / pending-sync banner (Phase 5f). Hidden until it has something
     true to say; never claims data is current when it isn't. -->
<div id="netbar" class="netbar hidden" role="status" aria-live="polite"></div>

<!-- Outbox prompt (Phase 5g): what was prepared in the field and still needs
     drafting into desktop Outlook. Appears only at a machine that has one. -->
<div id="outbox" class="netbar info hidden" role="status" aria-live="polite"></div>

<main class="content" id="main">
  <p class="placeholder">Search for a job to begin.</p>
</main>

<div id="identity" class="overlay hidden">
  <div class="dialog" id="identityBody"></div>
</div>

<script src="/vendor/pdfjs/pdf.min.js"></script>
<script src="/offline.js"></script>
<script src="/drawings.js"></script>
<script src="/app.js"></script>
</body>
</html>
